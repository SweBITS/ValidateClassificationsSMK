# -- Snakemake 9+ SLURM Executor --
executor: slurm

# -- Legacy Snakemake 7 cluster settings (kept for backwards compatibility) --
cluster:
    jobscript: "../slurm-jobscript.sh"
    submitcmd: "sbatch {dependencies}"

# -- Concurrency --
# Maximum number of jobs submitted to SLURM at once
jobs: 200

# -- Default Resources (Applied to all rules unless overridden) --
default-resources:
  slurm_account: "hpc2n2026-053"
  slurm_partition: "batch"
  runtime: "1h"
  mem_mb: 4000
  cpus_per_task: 8

# -- Rule-Specific Resources (Overrides defaults) --
set-resources:
  stream_kraken_cr:
    constraint: "largemem"