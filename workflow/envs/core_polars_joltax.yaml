# Core Python environment for clade resolution (JolTax via bioconda), Polars/Parquet
# aggregation, recursive OLS regression (SciPy/NumPy), and publication-grade visual reporting.
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python>=3.12
  - joltax>=0.3.0
  - polars>=2.0.0
  - pyarrow>=19.0.0
  - numpy>=2.0.0
  - scipy>=1.15.0
  - matplotlib-base>=3.10.0
  - seaborn-base>=0.13.2
  - plotly>=6.0.1
  - jinja2>=3.1.5
  - pyyaml>=6.0.2
